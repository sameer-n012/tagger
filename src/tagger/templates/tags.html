{% extends "base.html" %}
{% block title %}{{ source.display_name }} — manage tags{% endblock %}

{% block body %}
  <header class="page-topbar">
    <a class="brand" href="/sources">tagger</a>
    <span class="hint">{{ source.display_name }}</span>
    <a href="{{ back_url }}" style="margin-left:auto;">Back to files</a>
    <a class="icon-btn"
       href="/settings?next={{ (request.url.path ~ ('?' ~ request.url.query if request.url.query else '')) | urlencode }}"
       title="Settings">⚙</a>
  </header>

  {% include "_tag_manage_page.html" %}

  <script>
    var TAGGER_MANAGE_TAGS_LIMIT = 20;
    var taggerManageFilterQuery = '';

    function taggerFilterManageTags(query) {
      taggerManageFilterQuery = query;
      var q = query.trim().toLowerCase();
      var rows = Array.prototype.slice.call(document.querySelectorAll('.tag-manage-list > li'));
      var matches = rows.filter(function (li) {
        return !q || (li.dataset.name || '').indexOf(q) !== -1;
      });
      // Only ever show the most-used matches -- with dozens/hundreds of
      // tags, an unbounded list is unreadable and the rarely-used tail is
      // rarely what someone's looking for.
      matches.sort(function (a, b) { return Number(b.dataset.count) - Number(a.dataset.count); });
      var shown = new Set(matches.slice(0, TAGGER_MANAGE_TAGS_LIMIT));
      rows.forEach(function (li) {
        li.hidden = !shown.has(li);
      });
    }

    taggerFilterManageTags('');

    // Every mutating action on this page (rename, delete, add/remove
    // implied tag, create, clean, merge) is an htmx request that swaps
    // #tag-manage-page in place -- window scroll position is untouched by
    // that (unlike the full page reload this used to be), so no
    // scroll-preservation is needed. The filter box and its cap do need
    // reapplying after each swap, since the server always renders the
    // replacement list unfiltered.
    document.body.addEventListener('htmx:afterSettle', function () {
      var filterInput = document.querySelector('.tag-filter');
      if (filterInput) filterInput.value = taggerManageFilterQuery;
      taggerFilterManageTags(taggerManageFilterQuery);
    });
  </script>
{% endblock %}
