<!doctype html>
<html lang="en">
<head>

  <title>{% block title %}tagger{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>

</html>
